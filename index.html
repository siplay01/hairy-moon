<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hairy Moon: когда стричься</title>
<meta name="description" content="Лунный календарь стрижек на 44 города: хорошие окна на циферблате, дни, когда лучше не стричься, подписка для календаря.">
<meta name="theme-color" content="#08141F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e9e2cf'/%3E%3Cpath d='M16 2a14 14 0 0 1 0 28a9 14 0 0 0 0-28z' fill='%2308141F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span id="logo"></span><span>Hairy Moon</span></div>
    <div class="tools">
      <button class="chip" id="cityBtn" type="button" aria-expanded="false" aria-controls="cityPanel">Los Angeles</button>
      <button class="chip" id="lang" type="button" aria-label="Language">EN</button>
    </div>
  </header>
  <div class="panel" id="cityPanel" hidden>
    <div class="prow"><input id="citySearch" type="search" autocomplete="off" aria-label="Search city"><button class="btn ghost" id="locBtn" type="button"></button></div>
    <p class="pmsg" id="locMsg" role="status"></p>
    <ul class="clist" id="cityList"></ul>
  </div>

  <main>
    <section class="hero" id="hero" aria-live="polite"><div class="msg">...</div></section>

    <div class="layout">
      <section id="secDay" aria-labelledby="hDay">
        <h2 class="sr" id="hDay"></h2>
        <div class="dialcard" id="day"></div>
      </section>
      <section id="secCal" aria-labelledby="hCal">
        <h2 id="hCal"></h2>
        <div class="cal">
          <div class="calhead">
            <button class="nav" id="prev" type="button" aria-label="prev"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <div class="title" id="mtitle" aria-live="polite"></div>
            <button class="nav" id="next" type="button" aria-label="next"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="m7.5 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <div class="grid" id="dows" aria-hidden="true"></div>
          <div class="grid" id="grid"></div>
          <div class="legend" id="legend"></div>
          <div class="actions"><button class="chip" id="today" type="button"></button></div>
        </div>
      </section>
      <section id="secUp" aria-labelledby="hUp">
        <h2 id="hUp"></h2>
        <ol class="upcoming" id="upcoming"></ol>
      </section>
    </div>

    <details class="how"><summary id="hHow"></summary><div id="how"></div></details>
  </main>
  <footer id="foot"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
