<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hairy Moon: когда стричься</title>
<meta name="description" content="Лунный календарь стрижек на 44 города: подходящие дни зелёным, часы с окнами, подписка для календаря.">
<meta name="theme-color" content="#060d1a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e9e2cf'/%3E%3Cpath d='M16 2a14 14 0 0 1 0 28a9 14 0 0 0 0-28z' fill='%2308141F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="wheel" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><span id="logo"></span><span>Hairy Moon</span></div>
    <div class="tools">
      <button class="chip" id="cityBtn" type="button" aria-expanded="false" aria-controls="cityPanel">Los Angeles</button>
      <div class="seg" role="group" aria-label="Language / Язык"><button type="button" id="langRu" aria-pressed="true">RU</button><button type="button" id="langEn" aria-pressed="false">EN</button></div>
    </div>
  </header>
  <svg class="strands" viewBox="0 0 800 70" preserveAspectRatio="none" aria-hidden="true"><path class="h h1" d="M0 36C90 8 170 62 270 36S450 6 560 34 720 58 800 28"/><path class="h h2" d="M0 44C100 20 190 66 300 42S470 16 580 42 730 60 800 36"/><path class="t1" d="M0 36C90 8 170 62 270 36S450 6 560 34 720 58 800 28"/><path class="t2" d="M0 44C100 20 190 66 300 42S470 16 580 42 730 60 800 36"/><path class="t3" d="M0 28C80 4 160 52 260 30S440 2 550 28 710 50 800 18"/><path class="t3" d="M0 52C110 30 200 64 320 48S480 28 600 48 740 62 800 46"/></svg>
  <div class="panel" id="cityPanel" hidden>
    <div class="prow"><input id="citySearch" type="search" autocomplete="off" aria-label="Search city"><button class="btn ghost" id="locBtn" type="button"></button></div>
    <p class="pmsg" id="locMsg" role="status"></p>
    <ul class="clist" id="cityList"></ul>
  </div>

  <main>
    <section class="strip" id="hero" aria-live="polite"><div class="msg">...</div></section>

    <div class="layout">
      <section id="secCal" aria-labelledby="hCal">
        <h2 class="sr" id="hCal"></h2>
        <div class="cal">
          <div class="calhead">
            <button class="nav" id="prev" type="button" aria-label="prev"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <div class="title" id="mtitle" aria-live="polite"></div>
            <button class="nav" id="next" type="button" aria-label="next"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="m7.5 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <div class="grid" id="dows" aria-hidden="true"></div>
          <div class="grid" id="grid"></div>
          <div class="legend" id="legend"></div>
          <div class="actions"><button class="chip" id="today" type="button"></button></div>
        </div>
      </section>

      <aside class="sheet" id="sheet" aria-labelledby="hDay" aria-hidden="true">
        <div class="grab" id="grab"><span class="handle"></span></div>
        <div class="shead">
          <button class="nav sm" id="dayPrev" type="button" aria-label="prev day"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h2 id="hDay"></h2>
          <button class="nav sm" id="dayNext" type="button" aria-label="next day"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m7.5 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="nav sm close" id="sheetClose" type="button" aria-label="close"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
        <div class="seg vmode" id="vmode" role="group" aria-label="View"><button type="button" data-v="line" aria-pressed="true"></button><button type="button" data-v="slots" aria-pressed="false"></button><button type="button" data-v="clock" aria-pressed="false"></button></div>
        <div class="dialcard" id="day"></div>
      </aside>

      <section id="secUp">
        <details class="upd" id="upd"><summary id="hUp"></summary><ol class="upcoming" id="upcoming"></ol></details>
      </section>
    </div>

    <details class="how"><summary id="hHow"></summary><div id="how"></div></details>
  </main>
  <footer id="foot"></footer>
</div>
<script src="app.js"></script>
<script src="sky.js"></script>
</body>
</html>
