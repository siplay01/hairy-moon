<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hairy Moon: когда стричься</title>
<meta name="description" content="Лунный календарь стрижек для Лос-Анджелеса: хорошие окна, дни, когда лучше не стричься, подписка для iPhone.">
<meta name="theme-color" content="#0d1120">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e9e2cf'/%3E%3Cpath d='M16 2a14 14 0 0 1 0 28a9 14 0 0 0 0-28z' fill='%231d1c24'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span id="logo"></span><span>Hairy Moon</span></div>
    <div class="tools">
      <span class="chip" id="city" aria-label="City">Los Angeles</span>
      <button class="chip" id="lang" type="button" aria-label="Language">EN</button>
    </div>
  </header>

  <main>
    <section class="hero" id="hero" aria-live="polite"><div class="msg" id="heroMsg">...</div></section>

    <div class="layout">
      <section id="secCal">
        <h2 id="hCal"></h2>
        <div class="cal">
          <div class="calhead">
            <button class="nav" id="prev" type="button" aria-label="prev">&#8249;</button>
            <div class="title" id="mtitle" aria-live="polite"></div>
            <button class="nav" id="next" type="button" aria-label="next">&#8250;</button>
          </div>
          <div class="grid" id="dows" aria-hidden="true"></div>
          <div class="grid" id="grid"></div>
          <div class="legend" id="legend"></div>
          <div class="actions"><button class="chip" id="today" type="button"></button></div>
        </div>
      </section>
      <section id="secDay">
        <h2 id="hDay"></h2>
        <div class="day" id="day"></div>
      </section>
      <section id="secUp">
        <h2 id="hUp"></h2>
        <ol class="upcoming" id="upcoming"></ol>
      </section>
    </div>

    <details class="how"><summary id="hHow"></summary><div id="how"></div></details>
  </main>
  <footer id="foot"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
